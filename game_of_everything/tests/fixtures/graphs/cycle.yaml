systems:
  - id: target_system
    os: ubuntu_22_04
    services:
      - web
    network:
      hostname: target
      exposed_ports:
        - 3000
      internal_ports: []

entities:
  - id: entity_a
    description: Depends on entity_b — creates cycle
    system_id: target_system
    requires:
      - edge_id: op_to_a
        optional: false
      - edge_id: b_to_a
        optional: false
    provides:
      - a_to_b
    runtime: ubuntu
    atoms: []

  - id: entity_b
    description: Depends on entity_a — creates cycle
    system_id: target_system
    requires:
      - edge_id: a_to_b
        optional: false
    provides:
      - b_to_a
    runtime: ubuntu
    atoms: []

edges:
  - id: op_to_a
    from_entity: operator
    to_entity: entity_a
    type: network_reach
    params:
      host:
        structural: target
        concrete: null
      port:
        structural: "3000"
        concrete: null

  - id: a_to_b
    from_entity: entity_a
    to_entity: entity_b
    type: shell_as
    params:
      user:
        structural: app_user
        concrete: null
      host:
        structural: target
        concrete: null

  - id: b_to_a
    from_entity: entity_b
    to_entity: entity_a
    type: creds_for
    params:
      user:
        structural: admin
        concrete: null
      host:
        structural: target
        concrete: null
      cred_type:
        structural: password
        concrete: null
      secret:
        structural: db_user_password
        concrete: null
