id: xss_admin_bot_express_entity
description: "Express app with stored XSS and an admin bot — attacker posts a script payload that exfiltrates the admin's session cookie to a listener on the attacker container"
system_id: target_system
requires: []
provides:
  - admin_session_cookie
app_spec:
  runtime: express
  vulnerabilities:
    - xss_admin_bot
  goal: "steal the admin session cookie by injecting an XSS payload that fires when the admin bot visits the submissions page"
atoms:
  - xss_admin_bot
