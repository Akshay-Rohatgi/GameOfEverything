[project]
name = "game_of_everything"
version = "0.1.0"
description = "game_of_everything using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
dependencies = [
    # GoE v2 core dependencies
    "boto3>=1.34",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "docker>=7.0.0",
    "tomli>=2.0.0",
    "rich>=13.0.0",
    "chromadb>=1.5.9",
    "cryptography>=49.0.0",
    "playwright>=1.40.0",
    "bashlex>=0.18",  # Bash syntax validation for ScriptGrader
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
goe = "goe.flow.__main__:main"
kickoff = "game_of_everything.main:kickoff"
run_crew = "game_of_everything.main:kickoff"
plot = "game_of_everything.main:plot"
goe-destroy = "game_of_everything.main:destroy"
goe-deploy = "game_of_everything.main:deploy_from_output"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_of_everything", "goe"]

[tool.pytest.ini_options]
markers = [
    "docker: tests that require a running Docker daemon",
    "llm: tests that make real LLM API calls (requires AWS credentials in goe.toml)",
    "eval: evaluation tests (requires docker and llm)",
]

[tool.crewai]
type = "flow"
