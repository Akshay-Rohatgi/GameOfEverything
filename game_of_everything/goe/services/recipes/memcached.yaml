id: memcached
description: "Memcached distributed memory caching system"
apt_packages:
  - memcached
install: |
  apt-get update -qq 2>&1 | grep -v "^Get:" || true
  DEBIAN_FRONTEND=noninteractive apt-get install -y memcached 2>&1 | grep -v "^Selecting\|^Preparing\|^Unpacking\|^Setting up" || true
configure: |
  # Configure to listen on all interfaces
  sed -i 's/-l 127.0.0.1/-l 0.0.0.0/' /etc/memcached.conf
start: |
  # Start memcached
  memcached -d -u memcache -m 64 -p 11211 -l 0.0.0.0

  # Readiness check
  echo "Waiting for Memcached to be ready..."
  for i in $(seq 1 15); do
    if echo "stats" | nc localhost 11211 2>/dev/null | grep -q STAT; then
      echo "Memcached is ready after ${i}s"
      break
    fi
    sleep 1
  done

  if ! echo "stats" | nc localhost 11211 2>/dev/null | grep -q STAT; then
    echo "FATAL: Memcached failed to start after 15s"
    exit 1
  fi
healthcheck: "echo 'stats' | nc localhost 11211 2>/dev/null | grep -q STAT"
stop: "pkill -f memcached || true"
ports: [11211]
restart_after_snapshot: true
config_vars: {}
