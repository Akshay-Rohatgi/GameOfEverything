version: '3.8'
services:
  web_server:
    image: ubuntu:22.04
    hostname: webserver
    networks:
      default:
        aliases:
        - webserver
    command: bash -c 'echo 
      | base64 -d > /deploy.sh && bash /deploy.sh && sleep infinity'
    environment:
    - DEBIAN_FRONTEND=noninteractive
    ports:
    - 80:80
    - 443:443
    - '22:22'
  db_server:
    image: ubuntu:22.04
    hostname: dbserver
    networks:
      default:
        aliases:
        - dbserver
    command: sleep infinity
    environment:
    - DEBIAN_FRONTEND=noninteractive
networks:
  default:
    name: goe_net
    driver: bridge
