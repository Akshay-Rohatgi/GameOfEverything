procedure:
- action:
    command: ss -tlnp | grep ':22'
    type: exec_target
  expect:
    exit_code: 0
  outputs: {}
  session: null
  step_id: verify_ssh_running
  timeout: 10
- action:
    command: id lowpriv
    type: exec_target
  expect:
    stdout_contains: lowpriv
  outputs: {}
  session: null
  step_id: verify_user_exists
  timeout: 10
- action:
    command: sshpass -p password123 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
      lowpriv@${target_host} id
    type: exec_attacker
  expect:
    stdout_regex: uid=1001\(lowpriv\) gid=1001\(lowpriv\) groups=1001\(lowpriv\)
  outputs: {}
  session: null
  step_id: attempt_ssh_login
  timeout: 30
sessions: []
