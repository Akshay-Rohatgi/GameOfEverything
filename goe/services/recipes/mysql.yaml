id: mysql
description: "MariaDB 10.x database server with reliable Docker startup"
packages:
  - mariadb-server
  - mariadb-client
configure: |
  # Bind to all interfaces so other containers can connect
  sed -i 's/bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mariadb.conf.d/50-server.cnf
  # Ensure runtime directory exists and is owned by mysql
  mkdir -p /run/mysqld
  chown mysql:mysql /run/mysqld
start: |
  # Start mysqld_safe in background (handles crash recovery, restarts)
  mysqld_safe &

  # Readiness wait with explicit timeout
  echo "Waiting for MySQL to be ready..."
  for i in $(seq 1 30); do
    if mysqladmin ping -h localhost --silent 2>/dev/null; then
      echo "MySQL is ready after ${i}s"
      break
    fi
    sleep 1
  done

  # Final health check — fail the deployment if not ready
  if ! mysqladmin ping -h localhost --silent 2>/dev/null; then
    echo "FATAL: MySQL failed to start after 30s"
    exit 1
  fi
healthcheck: "mysqladmin ping -h localhost --silent"
stop: "mysqladmin shutdown 2>/dev/null || true"
ports: [3306]
restart_after_snapshot: true
config_vars:
  root_password:
    default: ""
    description: "Root user password (empty = no password, passwordless root)"
    # Runs `mysql -e ...` against the live server, so it must run after start.
    after_start: true
    apply: |
      if [ -n "{value}" ]; then
        # Create the remotely-reachable root@'%' account up front: cross-host
        # consumers (e.g. a web app on another host) build BEFORE this DB entity
        # runs its own setup.sh, so the remote account must already exist at
        # provision time. Do it in ONE `mysql -e` call (one socket-authed session)
        # and — critically — DO NOT alter root@'localhost' here. Setting a password
        # on root@'localhost' switches it from unix_socket to password auth, which
        # would deny every subsequent passwordless `mysql` call: both this recipe's
        # own follow-ups AND the entity's weak_service_password script (which
        # correctly sets the localhost password LAST, in a single session). Leaving
        # root@'localhost' on unix_socket keeps those passwordless calls working.
        mysql -e "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{value}'; ALTER USER 'root'@'%' IDENTIFIED BY '{value}'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;" 2>/dev/null || true
      fi
