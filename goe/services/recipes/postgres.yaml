id: postgres
description: "PostgreSQL database server (Debian cluster, no-systemd Docker startup)"
packages:
  - postgresql
  - postgresql-client
configure: |
  # Listen on all interfaces so the scenario is reachable over the network.
  # Version-agnostic: find the conf under /etc/postgresql/<ver>/main/.
  PG_CONF=$(find /etc/postgresql -name postgresql.conf 2>/dev/null | head -1)
  if [ -n "$PG_CONF" ]; then
    sed -i "s/^#\?listen_addresses.*/listen_addresses = '*'/" "$PG_CONF"
  fi
  # Ensure the runtime socket dir exists (postgres owns it).
  mkdir -p /var/run/postgresql
  chown postgres:postgres /var/run/postgresql 2>/dev/null || true
start: |
  # Start the default cluster WITHOUT systemd — these containers have no init.
  # pg_ctlcluster / pg_lsclusters are Debian postgresql-common tools; a Red Hat
  # profile (Week 8) will need its own init path (postgresql-setup + pg_ctl).
  PG_SPEC=$(pg_lsclusters 2>/dev/null | awk 'NR==2 {print $1, $2}')
  if [ -n "$PG_SPEC" ]; then
    pg_ctlcluster --skip-systemctl-redirect $PG_SPEC start 2>/dev/null \
      || pg_ctlcluster $PG_SPEC start 2>/dev/null || true
  fi

  echo "Waiting for PostgreSQL to be ready..."
  for i in $(seq 1 30); do
    if pg_isready -q 2>/dev/null; then
      echo "PostgreSQL is ready after ${i}s"
      break
    fi
    sleep 1
  done

  if ! pg_isready -q 2>/dev/null; then
    echo "FATAL: PostgreSQL failed to start after 30s"
    exit 1
  fi
healthcheck: "pg_isready -q"
stop: "pkill -u postgres || true"
ports: [5432]
restart_after_snapshot: true
config_vars: {}
