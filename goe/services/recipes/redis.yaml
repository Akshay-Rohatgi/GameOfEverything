id: redis
description: "Redis in-memory data store"
packages:
  - redis-server
  - redis-tools
configure: |
  # Bind to all interfaces
  sed -i 's/bind 127.0.0.1/bind 0.0.0.0/' /etc/redis/redis.conf
  sed -i 's/^protected-mode yes/protected-mode no/' /etc/redis/redis.conf
  # Ensure supervised is set to no (for manual daemonize)
  sed -i 's/^supervised .*/supervised no/' /etc/redis/redis.conf
  # Allow CONFIG SET of protected params (dir/dbfilename) and DEBUG commands.
  # Redis >= 7 (e.g. Debian 12 ships 7.0) protects these by default, which blocks
  # the standard file-write primitive (CONFIG SET dir -> SSH authorized_keys
  # injection). Enabling them is consistent with this recipe's intentionally
  # exploitable posture (it already binds 0.0.0.0 with protected-mode off).
  grep -q '^enable-protected-configs' /etc/redis/redis.conf || echo 'enable-protected-configs yes' >> /etc/redis/redis.conf
  grep -q '^enable-debug-command' /etc/redis/redis.conf || echo 'enable-debug-command yes' >> /etc/redis/redis.conf
start: |
  # Get password from config if set
  REDIS_PASS=$(grep "^requirepass" /etc/redis/redis.conf | awk '{print $2}' || true)

  # Start redis-server (daemonize mode)
  redis-server /etc/redis/redis.conf --daemonize yes 2>&1 || redis-server --daemonize yes

  # Readiness check (with password if set)
  echo "Waiting for Redis to be ready..."
  for i in $(seq 1 15); do
    if [ -n "$REDIS_PASS" ]; then
      if redis-cli --no-auth-warning -a "$REDIS_PASS" ping 2>&1 | grep -q PONG; then
        echo "Redis is ready after ${i}s"
        break
      fi
    else
      if redis-cli ping 2>&1 | grep -q PONG; then
        echo "Redis is ready after ${i}s"
        break
      fi
    fi
    sleep 1
  done

  # Final healthcheck
  if [ -n "$REDIS_PASS" ]; then
    if ! redis-cli --no-auth-warning -a "$REDIS_PASS" ping 2>&1 | grep -q PONG; then
      echo "FATAL: Redis failed to start after 15s"
      ps aux | grep redis || true
      exit 1
    fi
  else
    if ! redis-cli ping 2>&1 | grep -q PONG; then
      echo "FATAL: Redis failed to start after 15s"
      ps aux | grep redis || true
      exit 1
    fi
  fi
healthcheck: "redis-cli ping | grep -q PONG"
stop: "redis-cli shutdown || true"
ports: [6379]
restart_after_snapshot: true
config_vars:
  requirepass:
    default: ""
    description: "Redis password (empty = no auth)"
    apply: |
      if [ -n "{value}" ]; then
        echo "requirepass {value}" >> /etc/redis/redis.conf
      fi
